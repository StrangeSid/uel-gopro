[project]
name = "uel-gopro"
version = "0.1.0"
description = "Unofficial Extended Life GoPro CLI toolchain"
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [
    { name = "StrangeSid", email = "140191922+StrangeSid@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "bleak>=0.22.0",
    "httpx>=0.27.0",
    "psutil>=5.9.0",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "segno>=1.6.0",
    "typer>=0.12.0",
]

[project.scripts]
uel-gopro = "uel_gopro.cli.main:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.17.0",
]
