[project]
name = "uel-gopro"
version = "0.1.1"
description = "Unofficial Extended Life GoPro CLI toolchain"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["COPYING"]
authors = [
    { name = "StrangeSid", email = "140191922+StrangeSid@users.noreply.github.com" }
]
requires-python = ">=3.11"
keywords = ["gopro", "action-camera", "open-gopro", "telemetry", "gpmf", "cli", "mtp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
]

dependencies = [
    "bleak>=0.22.0",
    "httpx>=0.27.0",
    "psutil>=5.9.0",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "segno>=1.6.0",
    "typer>=0.12.0",
]

# MTP support on macOS uses ImageCaptureCore/Foundation through PyObjC.
# bleak already pulls Cocoa in on macOS, but declare it explicitly so the
# optional backend cannot silently disappear.
[project.optional-dependencies]
mtp = ["pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'"]

[project.urls]
Homepage = "https://github.com/StrangeSid/uel-gopro"
Repository = "https://github.com/StrangeSid/uel-gopro"
Issues = "https://github.com/StrangeSid/uel-gopro/issues"

[project.scripts]
uel-gopro = "uel_gopro.cli.main:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.17.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
